name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y empaquetar
        run: bash build.sh

      - name: Publicar el zip en la Release
        uses: softprops/action-gh-release@v2
        with:
          files: eca-decky.zip
